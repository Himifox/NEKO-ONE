name: Verify public runtime

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-verification:
    name: Debian 12 verification
    runs-on: ubuntu-latest # GitHub-managed Docker host; all run steps use the Debian container below.
    container:
      image: debian:12-slim
    timeout-minutes: 30
    env:
      NEKO_LANGUAGE: zh
      PYTHONUTF8: "1"
      NEKO_PUBLIC_DATABASE_URL: postgresql://neko_ci:neko_ci_password@127.0.0.1:5432/neko_ci_test
      NEKO_VERIFY_ALLOW_DATABASE_RESET: "1"

    steps:
      - name: Prepare Debian container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git nginx nodejs openssl postgresql postgresql-client
          pg_ctlcluster 15 main start
          runuser -u postgres -- psql -v ON_ERROR_STOP=1 -c "CREATE ROLE neko_ci LOGIN PASSWORD 'neko_ci_password'"
          runuser -u postgres -- createdb --owner=neko_ci neko_ci_test

      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify Debian Nginx configuration
        run: |
          install -d -m 0755 /etc/letsencrypt/live/neko.pardofelis.wiki
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj /CN=neko.pardofelis.wiki \
            -keyout /etc/letsencrypt/live/neko.pardofelis.wiki/privkey.pem \
            -out /etc/letsencrypt/live/neko.pardofelis.wiki/fullchain.pem
          install -m 0640 /dev/null /etc/nginx/neko-admin.htpasswd
          rm -f /etc/nginx/sites-enabled/default
          cp deploy/nginx-neko-public.conf /etc/nginx/conf.d/neko-public.conf
          nginx -t

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync locked dependencies
        run: uv sync --locked --no-dev

      - name: Verify public room behavior
        run: uv run --locked python scripts/verify_public_room.py

      - name: Verify SQLite to PostgreSQL migration
        run: uv run --locked python scripts/verify_postgres_migration.py

      - name: Verify Memory startup and local persistence
        run: uv run --locked python scripts/verify_memory_runtime.py

      - name: Verify public boundary and deployment security
        run: |
          uv run --locked python scripts/check_public_boundary.py
          uv run --locked python scripts/verify_deployment_security.py

      - name: Verify backup and isolated restore on Linux
        run: uv run --locked python scripts/verify_backup_restore.py

      - name: Verify public assets and provider acceptance harness
        run: |
          uv run --locked python scripts/verify_public_assets.py
          uv run --locked python scripts/verify_provider_acceptance.py

      - name: Verify browser scripts
        run: |
          node --check frontend/public-room/app.js
          node --check frontend/public-room/live2d.js
          node --check frontend/public-admin/app.js

      - name: Verify short room capacity baseline
        run: uv run --locked python scripts/verify_room_capacity.py

      - name: Compile and build distribution
        run: |
          uv run --locked python -m compileall -q app main_logic main_routers memory config utils scripts
          uv build
