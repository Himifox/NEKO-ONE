map $http_upgrade $neko_connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=neko_session:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=neko_admin:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=neko_http:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=neko_client:10m;
limit_conn_zone $binary_remote_addr zone=neko_ws:10m;

server_tokens off;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    server_name neko.example.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name neko.example.com;

    ssl_certificate /etc/letsencrypt/live/neko.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neko.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NEKOTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    large_client_header_buffers 4 8k;
    keepalive_timeout 30s;
    keepalive_requests 100;
    limit_conn neko_client 20;
    limit_conn_status 429;
    limit_req_status 429;

    # Hide application copies so every public response receives one canonical
    # edge policy, including Nginx-generated 4xx/5xx responses.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Strict-Transport-Security;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' wss:; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location = /api/v1/session/guest {
        limit_req zone=neko_session burst=3 nodelay;
        proxy_pass http://127.0.0.1:48911;
        include proxy_params;
    }

    location /ws/ {
        limit_conn neko_ws 3;
        proxy_pass http://127.0.0.1:48911;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $neko_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 30s;
    }

    # For stronger isolation, restrict /admin by VPN subnet or an additional
    # reverse-proxy authentication layer. The application also requires its own
    # password, signed HttpOnly cookie and CSRF token.
    location /admin {
        limit_req zone=neko_admin burst=20 nodelay;
        proxy_pass http://127.0.0.1:48911;
        include proxy_params;
    }

    location /api/v1/admin/ {
        limit_req zone=neko_admin burst=20 nodelay;
        proxy_pass http://127.0.0.1:48911;
        include proxy_params;
    }

    # Detailed dependency state is for the same-host monitor/load balancer.
    # The public liveness response remains available through the general API.
    location = /api/v1/health/ready {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:48911;
        include proxy_params;
    }

    location /api/v1/ {
        limit_req zone=neko_http burst=60 nodelay;
        proxy_pass http://127.0.0.1:48911;
        include proxy_params;
    }

    location / {
        limit_req zone=neko_http burst=60 nodelay;
        proxy_pass http://127.0.0.1:48911;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
