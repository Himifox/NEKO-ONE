<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="referrer" content="same-origin" />
    <title>NEKO 公共房间 · 直播中</title>
    <script src="/assets/room-theme.js?v=1"></script>
    <link rel="stylesheet" href="/assets/styles.css?v=9" />
  </head>
  <body>
    <main class="room-shell">
      <header class="live-bar" aria-label="直播间信息">
        <div class="live-bar-brand">
          <span class="live-badge" aria-hidden="true"><i class="live-badge-dot"></i>LIVE</span>
          <div class="room-title-lockup">
            <span class="room-monogram" aria-hidden="true">N</span>
            <div>
              <p class="eyebrow">长期在线实体 · PUBLIC ROOM</p>
              <h1>NEKO 公共房间</h1>
            </div>
          </div>
        </div>
        <div class="live-bar-stats">
          <div class="scene-pill" aria-label="当前房间时段">
            <span class="scene-indicator" aria-hidden="true"></span>
            <span><small>ROOM AMBIENCE</small><strong id="room-period-label">自动场景</strong></span>
          </div>
          <div class="viewers-chip" title="当前在线观看">
            <span class="presence-dot" aria-hidden="true"></span>
            <span id="online-count">0</span>
            <span>人观看</span>
          </div>
        </div>
        <div class="live-bar-actions">
          <button type="button" id="follow-button" class="action-button follow-button" aria-pressed="false">
            <span class="follow-heart" aria-hidden="true">♡</span>
            <span class="follow-label">关注</span>
          </button>
          <button type="button" id="like-button" class="action-button like-button">
            <span aria-hidden="true">♥</span><span>点赞</span>
            <span class="like-count-badge" id="like-count" aria-live="polite" hidden>0</span>
          </button>
          <div id="connection-state" class="connection-state" data-state="connecting">连接中</div>
        </div>
      </header>

      <section class="stage" aria-label="NEKO 形象区域">
        <div class="stage-glow" aria-hidden="true"></div>
        <div class="room-ambience" aria-hidden="true">
          <div class="room-light-pool"></div>
          <div class="room-curtain room-curtain-left"></div>
          <div class="room-curtain room-curtain-right"></div>
          <div class="room-lamp"></div>
        </div>
        <svg class="stage-ambience" viewBox="0 0 1000 700" preserveAspectRatio="none" aria-hidden="true" focusable="false">
          <g class="scene-set scene-morning">
            <g class="scene-sway">
              <path d="M112 0V88" class="scene-wire" />
              <path d="M112 86l24 34-24 34-24-34z" fill="rgba(255,225,176,.72)" stroke="#fff5db" stroke-width="4" />
              <path d="M112 88v64M89 120h46" stroke="rgba(255,255,255,.55)" stroke-width="2" />
              <circle cx="145" cy="104" r="7" class="scene-glint" fill="#fff1aa" />
            </g>
            <g class="scene-cup">
              <path d="M842 590h92v57c0 22-16 34-46 34s-46-12-46-34z" fill="rgba(255,244,235,.82)" stroke="#ffd2b0" stroke-width="5" />
              <path d="M932 606h18c27 0 27 37 0 37h-16" fill="none" stroke="#ffd2b0" stroke-width="8" />
              <path d="M860 574c-15-20 18-25 2-48M889 574c-15-20 18-25 2-48M918 574c-15-20 18-25 2-48" class="scene-steam" />
            </g>
            <g class="scene-motes" fill="#ffe7aa">
              <circle cx="210" cy="180" r="5" /><circle cx="272" cy="310" r="3" />
              <circle cx="760" cy="170" r="4" /><circle cx="692" cy="360" r="3" />
            </g>
          </g>

          <g class="scene-set scene-noon">
            <g class="scene-sway scene-wind-chime">
              <path d="M866 0v73M826 88h80M841 90l8 92M891 90l-8 92M866 91v121" class="scene-wire" />
              <path d="M836 183h26l-6 25h-14zM870 183h26l-6 25h-14z" fill="rgba(218,249,255,.82)" stroke="#a9e7f4" stroke-width="3" />
              <circle cx="866" cy="219" r="8" fill="#fff7bb" class="scene-glint" />
            </g>
            <g class="scene-pinwheel">
              <path d="M126 537v145" stroke="#d8f5ec" stroke-width="8" stroke-linecap="round" />
              <g class="scene-spin">
                <path d="M126 537c-52-8-63-42-43-64 31-2 47 20 43 64z" fill="#ffb8d7" />
                <path d="M126 537c8-52 42-63 64-43 2 31-20 47-64 43z" fill="#9debd0" />
                <path d="M126 537c52 8 63 42 43 64-31 2-47-20-43-64z" fill="#a8ddff" />
                <path d="M126 537c-8 52-42 63-64 43-2-31 20-47 64-43z" fill="#ffe49d" />
                <circle cx="126" cy="537" r="10" fill="#fff" />
              </g>
            </g>
            <g class="scene-motes" fill="#d9fbff">
              <circle cx="242" cy="150" r="4" /><circle cx="724" cy="248" r="5" />
              <circle cx="640" cy="104" r="3" /><circle cx="328" cy="390" r="3" />
            </g>
          </g>

          <g class="scene-set scene-afternoon">
            <g class="scene-branch">
              <path d="M0 92c74 12 132 30 196 77" fill="none" stroke="#765844" stroke-width="13" stroke-linecap="round" />
              <g class="scene-leaf-sway" fill="#a9c77d">
                <ellipse cx="67" cy="105" rx="15" ry="29" transform="rotate(-48 67 105)" />
                <ellipse cx="118" cy="132" rx="15" ry="31" transform="rotate(-35 118 132)" />
                <ellipse cx="167" cy="157" rx="14" ry="29" transform="rotate(-54 167 157)" />
              </g>
            </g>
            <g class="scene-book">
              <path d="M792 625q50-28 99 0v52q-49-24-99 0z" fill="rgba(255,246,220,.9)" stroke="#e6bd77" stroke-width="4" />
              <path d="M891 625q50-28 99 0v52q-49-24-99 0z" fill="rgba(255,246,220,.9)" stroke="#e6bd77" stroke-width="4" />
              <path d="M891 625v52" stroke="#d3a657" stroke-width="3" />
              <path d="M900 626q39-18 80 2v38q-39-16-80 0z" class="scene-page" fill="#fffaf0" />
            </g>
            <g fill="#f5b77c">
              <path d="M228 190q24 8 10 32-24-8-10-32z" class="scene-falling-leaf leaf-one" />
              <path d="M742 136q22 10 6 31-22-10-6-31z" class="scene-falling-leaf leaf-two" />
              <path d="M662 312q18 8 5 27-18-8-5-27z" class="scene-falling-leaf leaf-three" />
            </g>
          </g>

          <g class="scene-set scene-evening">
            <path d="M0 63q250 68 500 0t500 0" fill="none" stroke="rgba(84,61,78,.45)" stroke-width="4" />
            <g class="scene-fairy-lights">
              <circle cx="92" cy="80" r="9" /><circle cx="246" cy="102" r="9" />
              <circle cx="410" cy="82" r="9" /><circle cx="590" cy="82" r="9" />
              <circle cx="754" cy="102" r="9" /><circle cx="908" cy="80" r="9" />
            </g>
            <g class="scene-cup">
              <path d="M842 590h92v57c0 22-16 34-46 34s-46-12-46-34z" fill="rgba(255,230,207,.84)" stroke="#f2ad77" stroke-width="5" />
              <path d="M932 606h18c27 0 27 37 0 37h-16" fill="none" stroke="#f2ad77" stroke-width="8" />
              <path d="M860 574c-15-20 18-25 2-48M889 574c-15-20 18-25 2-48M918 574c-15-20 18-25 2-48" class="scene-steam" />
            </g>
            <g class="scene-fireflies" fill="#ffe78b">
              <circle cx="174" cy="290" r="5" /><circle cx="738" cy="270" r="4" />
              <circle cx="805" cy="400" r="5" /><circle cx="278" cy="430" r="4" />
            </g>
          </g>

          <g class="scene-set scene-late-night">
            <g class="scene-moon-lamp">
              <path d="M75 70c54 7 83 67 54 113-27 44-92 45-121 4 49 10 86-32 78-73-4-20-16-35-31-46z" fill="#dbe4ff" filter="drop-shadow(0 0 18px rgba(165,184,255,.8))" />
              <path d="M50 190v82M18 272h64" stroke="#bac9ff" stroke-width="9" stroke-linecap="round" />
            </g>
            <g class="scene-sway scene-star-mobile">
              <path d="M865 0v71M814 86h102M830 87v74M865 87v112M900 87v74" class="scene-wire" />
              <path d="M830 151l7 14 16 2-12 11 4 16-15-8-15 8 4-16-12-11 16-2z" fill="#dce5ff" />
              <path d="M865 187l7 14 16 2-12 11 4 16-15-8-15 8 4-16-12-11 16-2z" fill="#fff0ad" />
              <path d="M900 151l7 14 16 2-12 11 4 16-15-8-15 8 4-16-12-11 16-2z" fill="#dce5ff" />
            </g>
            <g class="scene-night-stars" fill="#d7e0ff">
              <circle cx="222" cy="162" r="4" /><circle cx="326" cy="96" r="3" />
              <circle cx="700" cy="194" r="5" /><circle cx="608" cy="330" r="3" />
              <circle cx="235" cy="412" r="4" />
            </g>
          </g>
        </svg>
        <canvas id="live2d-canvas" aria-label="NEKO Live2D" width="720" height="720"></canvas>
        <div class="avatar-placeholder" id="avatar-placeholder">
          <span>NEKO</span>
          <small>正在加载 Live2D</small>
        </div>
        <div class="avatar-caption">
          <small>RESIDENT HOST</small>
          <strong>NEKO</strong>
          <span>与你共享此刻的房间</span>
        </div>
        <div class="stage-onair" aria-hidden="true"><i></i>直播中</div>
        <div class="like-burst-layer" id="like-burst-layer" aria-hidden="true"></div>
      </section>

      <section class="chat-panel" aria-label="公共聊天">
        <header class="danmaku-header">
          <span class="danmaku-live-dot" aria-hidden="true"></span>
          <strong>弹幕</strong>
          <span class="danmaku-hint">实时滚动</span>
        </header>

        <div id="timeline" class="timeline" data-empty="true" role="log" aria-live="polite" aria-relevant="additions">
          <div id="stream-row" class="stream-row" hidden>
            <strong>NEKO</strong>
            <p id="stream-text"></p>
          </div>
        </div>

        <div class="room-status">
          <span class="queue-state-wrap"><i aria-hidden="true"></i><span id="queue-state">等待消息</span></span>
          <span class="room-status-actions">
            <button type="button" id="sound-toggle" class="text-button" aria-pressed="false">声音：开</button>
            <span id="visitor-name">游客</span>
          </span>
        </div>

        <form id="composer" autocomplete="off">
          <label class="sr-only" for="message-input">发送消息</label>
          <textarea
            id="message-input"
            rows="2"
            maxlength="2000"
            placeholder="和 NEKO 说点什么…"
            required
          ></textarea>
          <button type="submit" id="send-button"><span>发送</span><i aria-hidden="true">↗</i></button>
        </form>
      </section>
    </main>
    <script src="/runtime/live2dcubismcore.min.js"></script>
    <script src="/runtime/pixi-unsafe-eval-shim.js"></script>
    <script src="/runtime/pixi.min.js"></script>
    <script src="/runtime/pixi-live2d-display-cubism4.min.js"></script>
    <script src="/runtime/soullink-emotion-engine.min.js"></script>
    <script src="/assets/live2d.js?v=9" defer></script>
    <script src="/assets/app.js?v=5" defer></script>
    <script src="/assets/room-interactions.js?v=1" defer></script>
    <script src="/assets/cursor-tracker.js?v=1" defer></script>
  </body>
</html>
